[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nightcore"
version = "2026.11.18-1"
description = "Bit-perfect nightcore/speed/pitch audio tool (ffmpeg, sox, rubberband)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.10"
authors = [{ name = "Lev", email = "lev@lusosterone.net" }]
dependencies = ["mutagen"]

[project.urls]
Repository = "https://github.com/lusoterra/nightcore.py"

[project.scripts]
nightcore = "nightcore.cli:main"

[tool.setuptools.packages.find]
include = ["nightcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
